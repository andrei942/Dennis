<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Cube Fully Functional</title>
<style>
body { margin:0; font-family:sans-serif; text-align:center; }
#game {
  position: relative;
  width: 400px;
  height: 300px;
  margin: auto;
  background: #cce7ff;
  border: 3px solid black;
  overflow: hidden;
  touch-action: none;
}
#player {
  position: absolute;
  width: 30px;
  height: 30px;
  background: red;
  left: 10px;
  top: 250px;
}
.platform {
  position: absolute;
  width: 100px;
  height: 20px;
  background: green;
  border-radius: 4px;
}
#controls { display:flex; justify-content:center; gap:10px; margin-top:10px; }
#controls button { width:50px; height:50px; font-size:24px; user-select:none; }
</style>
</head>
<body>

<h2>Red Cube Fully Functional</h2>

<div id="game">
  <div id="player"></div>
  <!-- Platforms -->
  <div class="platform" style="left:50px; top:250px;"></div>
  <div class="platform" style="left:150px; top:200px;"></div>
  <div class="platform" style="left:250px; top:150px;"></div>
</div>

<div id="controls">
  <button id="leftBtn">◀</button>
  <button id="jumpBtn">▲</button>
  <button id="rightBtn">▶</button>
</div>

<script>
const player = document.getElementById('player');
const platforms = Array.from(document.querySelectorAll('.platform'));

// Player state
let px = 10, py = 250;
let vx = 0, vy = 0;
const speed = 4;
const jumpPower = -16;
const gravity = 0.7;
let left = false, right = false, jumpFlag = false;
let onGround = false;

// Platform coordinates (absolute numbers)
let platData = platforms.map(p => ({
  x: parseInt(p.style.left),
  y: parseInt(p.style.top),
  w: parseInt(p.style.width),
  h: parseInt(p.style.height)
}));

// Keyboard controls
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') left=true;
  if(e.key==='ArrowRight') right=true;
  if(e.key==='ArrowUp') jumpFlag=true;
});
document.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft') left=false;
  if(e.key==='ArrowRight') right=false;
  if(e.key==='ArrowUp') jumpFlag=false;
});

// Mobile controls
['leftBtn','rightBtn','jumpBtn'].forEach(id=>{
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e=>{ e.preventDefault(); if(id==='leftBtn') left=true; if(id==='rightBtn') right=true; if(id==='jumpBtn') jumpFlag=true; }, {passive:false});
  btn.addEventListener('touchend', e=>{ e.preventDefault(); if(id==='leftBtn') left=false; if(id==='rightBtn') right=false; if(id==='jumpBtn') jumpFlag=false; }, {passive:false});
});

// Game loop
function update(){
  // Horizontal movement
  vx = 0;
  if(left) vx = -speed;
  if(right) vx = speed;

  // Gravity
  vy += gravity;

  // Apply movement
  px += vx;
  py += vy;

  // Collision detection
  onGround = false;
  platData.forEach(p => {
    const playerBottom = py + 30;
    if(px + 30 > p.x && px < p.x + p.w &&
       playerBottom >= p.y && playerBottom <= p.y + 12 &&
       vy >=0){
      py = p.y - 30;
      vy = 0;
      onGround = true;
    }
  });

  // Jump
  if(jumpFlag && onGround){
    vy = jumpPower;
    onGround = false;
  }

  // Fall reset
  if(py > 300){
    px = 10;
    py = 250;
    vx = 0;
    vy = 0;
  }

  // Update player position
  player.style.left = px+'px';
  player.style.top = py+'px';

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
