<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dennis Cole</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Dennis Cole</h1>

<div id="game">
    <div class="player" id="player"></div>
    <div id="message"></div>
</div>

<p>Arrow keys or on-screen buttons to move!</p>
<div id="coins">Coins Collected: 0</div>

<!-- Mobile buttons -->
<div id="controls">
    <button id="leftBtn">◀</button>
    <button id="jumpBtn">▲</button>
    <button id="rightBtn">▶</button>
</div>

<!-- Sounds -->
<audio id="jumpSound" src="jump.wav"></audio>
<audio id="coinSound" src="coin.wav"></audio>
<audio id="checkpointSound" src="checkpoint.wav"></audio>

<script src="script.js"></script>
</body>
</html>
