<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dennis Cole</title>
<style>
body { margin:0; font-family:sans-serif; text-align:center; }
#game {
    position:relative;
    width:600px;
    height:400px;
    margin:auto;
    background:#cce7ff;
    border:3px solid #000;
    overflow:hidden;
}
#player {
    position:absolute;
    width:30px;
    height:30px;
    background:red;
    left:10px;
    top:350px;
    z-index:10;
}
.platform {
    position:absolute;
    width:100px;
    height:20px;
    background:green;
    border-radius:4px;
}
#controls { display:flex; justify-content:center; gap:20px; margin-top:10px; }
#controls button { width:60px; height:60px; font-size:30px; }
</style>
</head>
<body>

<h1>Dennis Cole</h1>
<div id="game">
    <div id="player"></div>
</div>

<div id="controls">
    <button id="leftBtn">◀</button>
    <button id="jumpBtn">▲</button>
    <button id="rightBtn">▶</button>
</div>

<script>
const player = document.getElementById("player");
const game = document.getElementById("game");

// Player variables
let px = 10, py = 350;
let vx = 0, vy = 0;
let speed = 5, jumpPower = -15;
let onGround = false;

// Movement flags
let left = false, right = false, jumpFlag = false;

// Platforms
const platformsData = [
    {x:50,y:300,w:100},
    {x:200,y:250,w:100},
    {x:350,y:200,w:100},
    {x:500,y:150,w:80},
    {x:50,y:100,w:120}
];

// Create platforms
let platforms = [];
platformsData.forEach(p=>{
    let el = document.createElement("div");
    el.className = "platform";
    el.style.left = p.x+"px";
    el.style.top = p.y+"px";
    el.style.width = p.w+"px";
    game.appendChild(el);
    platforms.push({...p, el});
});

// Keyboard input
document.addEventListener("keydown", e=>{
    if(e.key==="ArrowLeft") left=true;
    if(e.key==="ArrowRight") right=true;
    if(e.key==="ArrowUp") jumpFlag=true;
});
document.addEventListener("keyup", e=>{
    if(e.key==="ArrowLeft") left=false;
    if(e.key==="ArrowRight") right=false;
    if(e.key==="ArrowUp") jumpFlag=false;
});

// Mobile input
document.getElementById("leftBtn").addEventListener("pointerdown",()=>left=true);
document.getElementById("leftBtn").addEventListener("pointerup",()=>left=false);
document.getElementById("rightBtn").addEventListener("pointerdown",()=>right=true);
document.getElementById("rightBtn").addEventListener("pointerup",()=>right=false);
document.getElementById("jumpBtn").addEventListener("pointerdown",()=>jumpFlag=true);
document.getElementById("jumpBtn").addEventListener("pointerup",()=>jumpFlag=false);

// Game loop
function update() {
    // Horizontal movement
    vx = 0;
    if(left) vx=-speed;
    if(right) vx=speed;

    // Gravity
    vy += 0.8;

    // Apply movement
    px += vx;
    py += vy;

    // Collision detection
    onGround = false;
    platforms.forEach(p=>{
        const playerBottom = py + 30;
        if(px + 30 > p.x && px < p.x + p.w &&
           playerBottom >= p.y && playerBottom <= p.y + 5 && vy >= 0){
            py = p.y - 30;
            vy = 0;
            onGround = true;
        }
    });

    // Jump
    if(jumpFlag && onGround){
        vy = jumpPower;
        onGround = false;
    }

    // Fall reset
    if(py > 400){
        px = 10; py = 350;
        vx = 0; vy = 0;
    }

    // Apply position
    player.style.left = px+"px";
    player.style.top = py+"px";

    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
